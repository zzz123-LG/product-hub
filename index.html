<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>锁云 · 产品主数据 PIMDM Platform</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ======= 顶栏：页签标题 + 全局搜索 ======= -->
<header class="topbar">
  <div class="page-title" id="pageTitle">总览</div>
  <div class="topbar-right">
    <span class="sync-dot" id="syncDot" title="云端数据同步状态" style="display:none"></span>
    <div class="global-search">
      <input id="globalSearch" type="search" placeholder="搜索型号 / 系列 / 标签 / 渠道…" autocomplete="off">
      <div class="suggest-pop" id="suggestPop"></div>
    </div>
    <div class="bell-wrap">
      <button class="bell-btn" id="bellBtn" title="待办与提醒">待办<span class="dot" id="bellDot" style="display:none">0</span></button>
      <div class="pop-menu" id="bellPop">
        <div class="pop-title">我的待办 <button id="clearTodos">全部已读</button></div>
        <div id="todoList"></div>
      </div>
    </div>
  </div>
</header>

<div class="layout">
  <!-- ======= 侧边导航 ======= -->
  <nav class="sidenav" id="sidenav"></nav>

  <!-- ======= 主内容 ======= -->
  <main class="main">
    <!-- 看板 -->
    <section class="view" id="view-dashboard"></section>
    <!-- 产品库 -->
    <section class="view" id="view-products"></section>
    <!-- 假锁中心 -->
    <section class="view" id="view-fakeLock"></section>
    <!-- 配件定价 -->
    <section class="view" id="view-accessories"></section>
    <!-- 价格趋势 -->
    <section class="view" id="view-trend"></section>
    <!-- 导入识别 -->
    <section class="view" id="view-import"></section>
    <!-- 审核中心 -->
    <section class="view" id="view-review"></section>
    <!-- 数据质量 -->
    <section class="view" id="view-quality"></section>
    <!-- 回收站 -->
    <section class="view" id="view-bin"></section>
    <!-- 设置 -->
    <section class="view" id="view-settings"></section>
  </main>
</div>

<!-- ======= 移动端底部导航 ======= -->
<nav class="mob-nav" id="mobNav"></nav>

<!-- ======= 详情抽屉 ======= -->
<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer"></aside>

<!-- ======= 通用模态框 ======= -->
<div class="modal-mask" id="modalMask"><div class="modal" id="modalBox"></div></div>

<div class="toast-wrap" id="toastWrap"></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="js/seed.js"></script>
<script src="js/price-trend.js"></script>
<script src="js/cloud.js"></script>
<script src="js/app.js"></script>
</body>
</html>
